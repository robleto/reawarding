[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # CORE_LOOP_MOVIE_QUERY is a Playwright test variable whose value ("Inception")
  # legitimately appears in the UI. It is not a secret and should not be set in
  # the Netlify production environment at all. If it must remain, omit it from
  # secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "CORE_LOOP_MOVIE_QUERY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# @netlify/plugin-lighthouse was removed 2026-08-24 to cut build minutes. It
# ran on every deploy preview as well as production, and nobody was acting on a
# performance audit of a preview URL.
#
# Scoping it to production instead was tried first, via
# [[context.production.plugins]], and Netlify failed the deploy on it — that
# syntax isn't supported for plugins. Don't retry that approach.
#
# To bring Lighthouse back, restore a plain [[plugins]] block and accept that
# it runs in every context. For a one-off audit, run Lighthouse locally against
# a deploy URL instead.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/_next/image"
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200
  query = { url = ":url", w = ":width", q = ":quality" }

[[redirects]]
  from = "/_ipx/*"
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200
  query = { url = ":url", w = ":width", q = ":quality" }
