[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # CORE_LOOP_MOVIE_QUERY is a Playwright test variable whose value ("Inception")
  # legitimately appears in the UI. It is not a secret and should not be set in
  # the Netlify production environment at all. If it must remain, omit it from
  # secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "CORE_LOOP_MOVIE_QUERY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Lighthouse is scoped to production rather than declared under a bare
# [[plugins]] block, which would run it on every deploy preview too. Previews
# exist to check that a branch builds and renders; a performance audit of a
# preview URL isn't acted on, so it was pure build-minute overhead on every PR.
#
# Verify after the next preview deploy: the plugin should appear in the
# production deploy log and be absent from preview logs. If it shows up in
# neither, this context syntax isn't being honored — move it back to a plain
# [[plugins]] block and accept the cost, or drop the plugin.
[[context.production.plugins]]
  package = "@netlify/plugin-lighthouse"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/_next/image"
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200
  query = { url = ":url", w = ":width", q = ":quality" }

[[redirects]]
  from = "/_ipx/*"
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200
  query = { url = ":url", w = ":width", q = ":quality" }
