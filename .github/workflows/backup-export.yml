name: Daily Backup Export

on:
  schedule:
    - cron: '15 4 * * *' # Daily at 04:15 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip invoking function, print safe diagnostics only'
        required: false
        default: 'false'

jobs:
  export:
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DEBUG_CRON: '1'
    steps:
      - name: Validate required secrets
        run: |
          [ -n "$SUPABASE_URL" ] || { echo "Missing SUPABASE_URL repo secret" >&2; exit 1; }
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "Missing SUPABASE_ANON_KEY repo secret" >&2; exit 1; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY repo secret" >&2; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "Missing CRON_SECRET repo secret" >&2; exit 1; }

      - name: Call backup-export Edge Function
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          http_code=$(curl -sS -D /tmp/headers.txt -o /tmp/resp.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/functions/v1/backup-export" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "X-CRON-SECRET: $CRON_SECRET" \
            -H "X-CRON-TOKEN: $CRON_SECRET" \
            -H "X-JOB-TOKEN: $CRON_SECRET" \
            -H "X-Debug: 1" \
            -H "Content-Type: application/json" \
            --data "{\"cron_secret\":\"$CRON_SECRET\"}")
          ec=$?
          echo "HTTP: $http_code"
          echo "--- Response headers (filtered) ---"
          grep -iE '^(x-reason|content-type|server|x-version):' /tmp/headers.txt || true
          head -c 2000 /tmp/resp.json || true; echo
          if [ "$ec" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "Primary endpoint failed, trying functions subdomain..."
            REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^\.]+)\..*#\1#')
            FUNCS_URL="https://$REF.functions.supabase.co/backup-export"
            http_code2=$(curl -sS -D /tmp/headers2.txt -o /tmp/resp2.json -w '%{http_code}' -X POST \
              "$FUNCS_URL" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "X-CRON-SECRET: $CRON_SECRET" \
              -H "X-CRON-TOKEN: $CRON_SECRET" \
              -H "X-JOB-TOKEN: $CRON_SECRET" \
              -H "X-Debug: 1" \
              -H "Content-Type: application/json" \
              --data "{\"cron_secret\":\"$CRON_SECRET\"}")
            echo "HTTP (functions subdomain): $http_code2"
            echo "--- Response headers (filtered, subdomain) ---"
            grep -iE '^(x-reason|content-type|server|x-version):' /tmp/headers2.txt || true
            head -c 2000 /tmp/resp2.json || true; echo
            if [ "$http_code2" != "200" ]; then exit 1; fi
          fi

      - name: Dry-run diagnostics
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run enabled. Skipping remote calls."
          echo "Endpoint: $SUPABASE_URL/functions/v1/backup-export"
          echo "Headers used: Authorization: Bearer <SR>, apikey: <anon>, X-CRON-SECRET (masked)"
      - name: Done
        run: echo "Backup export triggered"

      - name: Verify backup files in Storage
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          DATE_PREFIX=$(date -u +%Y%m%d)
          echo "Checking backups for $DATE_PREFIX"
          resp=$(curl -sS -X POST \
            "$SUPABASE_URL/storage/v1/object/list/backups" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"prefix\":\"$DATE_PREFIX/\",\"limit\":200,\"offset\":0,\"sortBy\":{\"column\":\"name\",\"order\":\"asc\"}}")
          echo "$resp"
          # Simple presence check for a key table file
          echo "$resp" | grep -q '"name":"movies.json"' && echo "Found movies.json" || { echo "movies.json not found" >&2; exit 1; }
