name: Daily Backup Export

on:
  schedule:
    - cron: '15 4 * * *' # Daily at 04:15 UTC
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          [ -n "${{ secrets.SUPABASE_URL }}" ] || { echo "Missing SUPABASE_URL repo secret" >&2; exit 1; }
          [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ] || { echo "Missing SUPABASE_ANON_KEY repo secret" >&2; exit 1; }
          [ -n "${{ secrets.CRON_SECRET }}" ] || { echo "Missing CRON_SECRET repo secret" >&2; exit 1; }
          echo "ANON_LEN=${#{{ secrets.SUPABASE_ANON_KEY }}}"
          echo "CRON_LEN=${#{{ secrets.CRON_SECRET }}}"

      - name: Call backup-export Edge Function
        run: |
          http_code=$(curl -fSs -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "X-CRON-SECRET: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/backup-export") && true
          echo "HTTP: $http_code"
          cat /tmp/resp.json || true
          [ "$http_code" = "200" ] || exit 1

      - name: Done
        run: echo "Backup export triggered"
