name: Daily Backup Export

on:
  schedule:
    - cron: '15 4 * * *' # Daily at 04:15 UTC
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable function debug (adds X-Debug: 1)'
        required: false
        default: '0'

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DEBUG_CRON: ${{ github.event.inputs.debug }}
    steps:
      - name: Validate required secrets
        run: |
          [ -n "$SUPABASE_URL" ] || { echo "Missing SUPABASE_URL repo secret" >&2; exit 1; }
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "Missing SUPABASE_ANON_KEY repo secret" >&2; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "Missing CRON_SECRET repo secret" >&2; exit 1; }
          echo "ANON_LEN=$(printf '%s' "$SUPABASE_ANON_KEY" | wc -c)"
          echo "CRON_LEN=$(printf '%s' "$CRON_SECRET" | wc -c)"

      - name: Call backup-export Edge Function
        run: |
          http_code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "X-CRON-SECRET: $CRON_SECRET" \
            -H "X-Debug: ${DEBUG_CRON:-0}" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/functions/v1/backup-export")
          ec=$?
          echo "HTTP: $http_code"
          cat /tmp/resp.json || true
          if [ "$ec" -ne 0 ] || [ "$http_code" != "200" ]; then exit 1; fi

      - name: Done
        run: echo "Backup export triggered"
