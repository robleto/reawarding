name: Ingest Discover + Enrich

on:
  # Daily discovery + enrichment. 08:30 UTC keeps it well off the enrich-movies
  # crons (which run at :17 every 6h) so the two pipelines don't compete for
  # TMDB rate limits. Manual workflow_dispatch still available below.
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Popularity pages to fetch'
        required: false
        default: '10'
      revenue_pages:
        description: 'Revenue pages to fetch'
        required: false
        default: '5'
      year_from:
        description: 'Release year floor (optional)'
        required: false
        default: ''
      min_votes:
        description: 'Minimum TMDB vote_count (optional)'
        required: false
        default: ''
      quality_pages:
        description: 'vote_count-sorted pages to fetch for the current/prior year (catches acclaimed titles that never chart on popularity/revenue)'
        required: false
        default: '3'
      quality_min_votes:
        description: 'Minimum TMDB vote_count for the quality pass'
        required: false
        default: '150'
      limit:
        description: 'Max movies to enrich'
        required: false
        default: '1900'
      request_delay:
        description: 'Enrich request delay (seconds)'
        required: false
        default: '0.3'

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      LIMIT: ${{ github.event.inputs.limit || '1900' }}
      REQUEST_DELAY: ${{ github.event.inputs.request_delay || '0.3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt supabase

      - name: Discover movies via TMDB
        run: |
          PAGES=${{ github.event.inputs.pages || '10' }}
          REVENUE_PAGES=${{ github.event.inputs.revenue_pages || '5' }}
          YEAR_FROM=${{ github.event.inputs.year_from || '' }}
          MIN_VOTES=${{ github.event.inputs.min_votes || '' }}

          ARGS=("--pages=$PAGES" "--revenue-pages=$REVENUE_PAGES")
          if [ -n "$YEAR_FROM" ]; then ARGS+=("--year-from=$YEAR_FROM"); fi
          if [ -n "$MIN_VOTES" ]; then ARGS+=("--min-votes=$MIN_VOTES"); fi

          npm run ingest:discover -- "${ARGS[@]}"

      - name: Discover acclaimed titles missed by popularity/revenue (current + prior year)
        run: |
          QUALITY_PAGES=${{ github.event.inputs.quality_pages || '3' }}
          QUALITY_MIN_VOTES=${{ github.event.inputs.quality_min_votes || '150' }}
          CURRENT_YEAR=$(date +%Y)
          PRIOR_YEAR=$((CURRENT_YEAR - 1))

          # Sorts by vote_count instead of today's popularity/revenue, so
          # limited-release/festival/awards titles that build up votes over
          # time (e.g. Poor Things, Past Lives, Anatomy of a Fall) get caught
          # instead of only ever surfacing via the historical backfill.
          npm run ingest:discover -- --pages=0 --revenue-pages=0 \
            --quality-pages="$QUALITY_PAGES" --year="$CURRENT_YEAR" --min-votes="$QUALITY_MIN_VOTES"
          npm run ingest:discover -- --pages=0 --revenue-pages=0 \
            --quality-pages="$QUALITY_PAGES" --year="$PRIOR_YEAR" --min-votes="$QUALITY_MIN_VOTES"

      - name: Enrich movies
        run: npm run ingest:enrich
