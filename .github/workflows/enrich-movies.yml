name: Enrich Movies

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max movies to enrich this run'
        required: false
        default: '500'
      request_delay:
        description: 'Delay between TMDB requests in seconds'
        required: false
        default: '0.3'
      enrich_media:
        description: 'Fetch videos, images, keywords, providers, similar titles, and reviews'
        required: false
        default: 'true'

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      LIMIT: ${{ github.event.inputs.limit || '500' }}
      REQUEST_DELAY: ${{ github.event.inputs.request_delay || '0.3' }}
      ENRICH_MEDIA: ${{ github.event.inputs.enrich_media || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt supabase

      - name: Validate required secrets
        run: |
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL repo secret" >&2; exit 1; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY repo secret" >&2; exit 1; }
          [ -n "$TMDB_API_KEY" ] || { echo "Missing TMDB_API_KEY repo secret" >&2; exit 1; }

      - name: Enrich movies from TMDB
        run: python scripts/enrich_movies_enhanced.py
