name: Trending Refresh

on:
  schedule:
    - cron: '7 * * * *' # Hourly at minute 7 UTC
  workflow_dispatch:

jobs:
  call:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate required secrets
        run: |
          [ -n "$SUPABASE_URL" ] || { echo "Missing SUPABASE_URL repo secret" >&2; exit 1; }
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "Missing SUPABASE_ANON_KEY repo secret" >&2; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "Missing CRON_SECRET repo secret" >&2; exit 1; }
          # Print non-sensitive diagnostics (lengths only)
          echo "ANON_LEN=$(printf '%s' "$SUPABASE_ANON_KEY" | wc -c)"
          echo "CRON_LEN=$(printf '%s' "$CRON_SECRET" | wc -c)"

      - name: Invoke tmdb-trending-scraper
        run: |
          # Call function, capture HTTP and body
          http_code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/functions/v1/tmdb-trending-scraper" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "X-CRON-SECRET: $CRON_SECRET" \
            --data '{"source":"github-action"}')
          ec=$?
          echo "HTTP: $http_code"
          cat /tmp/resp.json || true
          if [ "$ec" -ne 0 ] || [ "$http_code" != "200" ]; then exit 1; fi
      - name: Done
        run: echo "Trending refresh triggered"
