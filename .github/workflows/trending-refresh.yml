name: Trending Refresh

on:
  schedule:
    - cron: '7 * * * *' # Hourly at minute 7 UTC
  workflow_dispatch:

jobs:
  call:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DEBUG_CRON: '1'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Validate required secrets
        run: |
          [ -n "$SUPABASE_URL" ] || { echo "Missing SUPABASE_URL repo secret" >&2; exit 1; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY repo secret" >&2; exit 1; }
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "Missing SUPABASE_ANON_KEY repo secret" >&2; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "Missing CRON_SECRET repo secret" >&2; exit 1; }
          # Print non-sensitive diagnostics (lengths only)
          echo "SR_LEN=$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | wc -c)"
          echo "CRON_LEN=$(printf '%s' "$CRON_SECRET" | wc -c)"
          echo "CRON_SHA_PREFIX=$(printf '%s' "$CRON_SECRET" | shasum -a 256 | awk '{print substr($1,1,16)}')"

      - name: Invoke tmdb-trending-scraper
        run: |
          # Call function, capture HTTP and body
          http_code=$(curl -sS -D /tmp/headers.txt -o /tmp/resp.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/functions/v1/tmdb-trending-scraper?cron_secret=$CRON_SECRET" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "X-CRON-SECRET: $CRON_SECRET" \
            -H "X-CRON-TOKEN: $CRON_SECRET" \
            -H "X-JOB-TOKEN: $CRON_SECRET" \
            -H "X-Debug: 1" \
            --data "{\"source\":\"github-action\",\"cron_secret\":\"$CRON_SECRET\"}")
          ec=$?
          echo "HTTP: $http_code"
          echo "--- Response headers (filtered) ---"
          grep -iE '^(x-reason|content-type|server):' /tmp/headers.txt || true
          cat /tmp/resp.json || true
          if [ "$ec" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "Primary endpoint failed, trying functions subdomain..."
            # Derive project ref from SUPABASE_URL (https://<ref>.supabase.co)
            REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^\.]+)\..*#\1#')
            FUNCS_URL="https://$REF.functions.supabase.co/tmdb-trending-scraper"
            http_code2=$(curl -sS -D /tmp/headers2.txt -o /tmp/resp2.json -w '%{http_code}' -X POST \
              "$FUNCS_URL?cron_secret=$CRON_SECRET" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "X-CRON-SECRET: $CRON_SECRET" \
              -H "X-CRON-TOKEN: $CRON_SECRET" \
              -H "X-JOB-TOKEN: $CRON_SECRET" \
              -H "X-Debug: 1" \
              --data "{\"source\":\"github-action\",\"cron_secret\":\"$CRON_SECRET\"}")
            echo "HTTP (functions subdomain): $http_code2"
            echo "--- Response headers (filtered, subdomain) ---"
            grep -iE '^(x-reason|content-type|server|x-version):' /tmp/headers2.txt || true
            cat /tmp/resp2.json || true
            if [ "$http_code2" != "200" ]; then exit 1; fi
          fi
      - name: Done
        run: echo "Trending refresh triggered"
